<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: where supported (Android Chrome), the
         on-screen keyboard shrinks the layout viewport, so bottom sheets and their
         action buttons stay above the keyboard instead of behind it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Repainted at runtime to match the active theme, so the mobile browser
         chrome matches the app instead of flashing white. -->
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="Khata — a premium cash book, personal ledger and personal finance system." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Khata — Cash Book &amp; Personal Ledger</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="khata-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      media="print"
    />

    <!-- Same-origin classic script, so the Content-Security-Policy needs no inline-script exception. Blocking on purpose: see the file. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>JavaScript is required</h1>
        <p>Khata needs JavaScript to keep your ledger working offline and in sync.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
